name: 定期スクレイピング

on:
  schedule:
    # 毎日午前6時（JST）= UTC 21:00（前日）
    - cron: '0 21 * * *'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: JDK 17 をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: アプリケーションをビルド
        working-directory: ./backend
        run: mvn clean package -DskipTests -q

      - name: JARをリネーム
        run: cp backend/target/*.jar backend/target/app.jar

      - name: JARをEC2に転送
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/target/app.jar"
          target: "/tmp/"
          strip_components: 2

      - name: EC2でスクレイピングを実行
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            docker stop selenium-scrape 2>/dev/null || true
            docker rm selenium-scrape 2>/dev/null || true
            docker network rm scrape-net 2>/dev/null || true
            docker network create scrape-net
            docker run -d --name selenium-scrape --network scrape-net --shm-size=2gb selenium/standalone-chromium:latest
            sleep 10
            docker run --rm --network scrape-net \
              --env-file /app/GachaHub/.env \
              -e SPRING_PROFILES_ACTIVE=scrape \
              -e SELENIUM_REMOTE_URL=http://selenium-scrape:4444/wd/hub \
              -v /tmp/app.jar:/app.jar \
              eclipse-temurin:17-jre java -jar /app.jar
            docker stop selenium-scrape && docker rm selenium-scrape || true
            docker network rm scrape-net || true
